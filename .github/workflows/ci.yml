name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  cargo:
    uses: vexxhost/github-actions/.github/workflows/cargo.yml@ee90fdf77bca9a1426af5073b44cae27dc0bdaca # main

  build:
    runs-on: ubuntu-24.04${{ matrix.target == 'aarch64' && '-arm' || '' }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: step-security/rust-cache@851174d9a2fdc03e0896e02844dcc61d81dd7851 # v2.9.1
      - run: rustup show
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.9.6
          command: build
          manylinux: "2_28"
          args: --release --sdist
          sccache: "true"
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/wheels/*.whl
            target/wheels/*.tar.gz

  coinstall:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    strategy:
      fail-fast: false
      matrix:
        openstack-version:
          - "2023.1"
          - "2023.2"
          - "2024.1"
          - "2024.2"
          - "2025.1"
          - "master"
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
        include:
          - openstack-version: "zed"
            python-version: "3.10"
        exclude:
          - openstack-version: "2023.1"
            python-version: "3.12"
          - openstack-version: "2023.2"
            python-version: "3.12"
          - openstack-version: "master"
            python-version: "3.10"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: step-security/setup-uv@479ad0a90c4286eda3535eb7db396ed723b63fb7 # v8.1.0
        with:
          ignore-empty-workdir: true
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-x86_64
      - run: |
          uv venv
          uv pip install --constraint https://releases.openstack.org/constraints/upper/${{ matrix.openstack-version }} ./*.whl
      - name: Smoke-test driver import and entry-point loading
        run: |
          uv pip install --constraint https://releases.openstack.org/constraints/upper/${{ matrix.openstack-version }} \
            magnum keystonemiddleware
          .venv/bin/python - <<'PY'
          import sys
          import magnum_cluster_api.driver  # must not raise
          from magnum.drivers.common import driver

          # Magnum entry points must load
          eps = list(driver.Driver.load_entry_points())
          ep_names = sorted(ep.name for ep, _ in eps)
          assert any("cluster_api" in n for n in ep_names), ep_names

          # Driver.definition_map must be populated — this is what
          # instantiates each driver class and fails in production when
          # pkg_resources cannot resolve a PEP 625 oslo_cache-*.dist-info.
          definition_map = driver.Driver.get_drivers()
          assert definition_map, "Driver.get_drivers() returned empty definition_map"
          assert ("vm", "ubuntu", "kubernetes") in definition_map, (
              "expected (vm, ubuntu, kubernetes) cluster_api driver in "
              "definition_map, got: %s" % sorted(definition_map)
          )

          # Regression guard: pkg_resources must never be imported. It
          # does not apply PEP 503 name normalization across .|_|-, which
          # is what breaks against PEP 625-named wheels (oslo_cache-*).
          assert "pkg_resources" not in sys.modules, (
              "pkg_resources must not be loaded — it breaks on PEP 625 "
              "wheels (e.g. oslo_cache-*.dist-info)"
          )

          print("OK entry_points=%d definitions=%d" % (len(eps), len(definition_map)))
          print("  entry_points:", ep_names)
          print("  definitions :", sorted(definition_map))
          PY

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: github.event_name == 'pull_request' && github.event.pull_request.user.id == 29139614
        id: app-token
        with:
          client-id: ${{ vars.VEXXHOST_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.VEXXHOST_CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      - uses: step-security/git-auto-commit-action@749bc1cc775376092cc4227ba537137f445ca7c3 # v7.1.1
        if: github.event_name == 'pull_request' && github.event.pull_request.user.id == '29139614' && always()
        with:
          commit_message: "chore: apply pre-commit hook updates"
          commit_author: "renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>"

  chart-vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: vexxhost/chart-vendor@c1c3ea98adafbfe137a26ae8045c38bae7ed72dc # main
        with:
          charts-root: magnum_cluster_api/charts
