- project-template:
    name: magnum-cluster-api-hydrophone-jobs
    check:
      jobs:
        - magnum-cluster-api-hydrophone-v1.35.10-calico
        - magnum-cluster-api-hydrophone-v1.35.10-cilium
        - magnum-cluster-api-hydrophone-v1.36.6-calico
        - magnum-cluster-api-hydrophone-v1.36.6-cilium
        - magnum-cluster-api-hydrophone-v1.37.2-calico
        - magnum-cluster-api-hydrophone-v1.37.2-cilium
        - magnum-cluster-api-hydrophone-kubelet-serving-cert-verification
    gate:
      jobs:
        - magnum-cluster-api-hydrophone-v1.35.10-calico
        - magnum-cluster-api-hydrophone-v1.35.10-cilium
        - magnum-cluster-api-hydrophone-v1.36.6-calico
        - magnum-cluster-api-hydrophone-v1.36.6-cilium
        - magnum-cluster-api-hydrophone-v1.37.2-calico
        - magnum-cluster-api-hydrophone-v1.37.2-cilium
        - magnum-cluster-api-hydrophone-kubelet-serving-cert-verification
- job:
    name: magnum-cluster-api-hydrophone
    parent: magnum-cluster-api-devstack
    abstract: true
    pre-run: zuul.d/playbooks/hydrophone/pre.yml
    run: zuul.d/playbooks/hydrophone/run.yml
    post-run: zuul.d/playbooks/hydrophone/post.yml
    vars:
      image_prefix: ubuntu-24.04
      image_url: https://github.com/vexxhost/capo-image-elements/releases/download/{{ image_release }}/{{ image_prefix }}-{{ kube_tag }}.qcow2
      devstack_localrc:
        MAGNUM_GUEST_IMAGE_URL: '{{ image_url }}'
- job:
    name: magnum-cluster-api-hydrophone-v1.35.10
    parent: magnum-cluster-api-hydrophone
    vars:
      image_release: 2026.10-0
      kube_tag: v1.35.10
- job:
    name: magnum-cluster-api-hydrophone-v1.35.10-calico
    parent: magnum-cluster-api-hydrophone-v1.35.10
    vars:
      network_driver: calico
- job:
    name: magnum-cluster-api-hydrophone-v1.35.10-cilium
    parent: magnum-cluster-api-hydrophone-v1.35.10
    vars:
      network_driver: cilium
- job:
    name: magnum-cluster-api-hydrophone-v1.36.6
    parent: magnum-cluster-api-hydrophone
    vars:
      image_release: 2026.10-0
      kube_tag: v1.36.6
- job:
    name: magnum-cluster-api-hydrophone-v1.36.6-calico
    parent: magnum-cluster-api-hydrophone-v1.36.6
    vars:
      network_driver: calico
- job:
    name: magnum-cluster-api-hydrophone-v1.36.6-cilium
    parent: magnum-cluster-api-hydrophone-v1.36.6
    vars:
      network_driver: cilium
- job:
    name: magnum-cluster-api-hydrophone-v1.37.2
    parent: magnum-cluster-api-hydrophone
    vars:
      image_release: 2026.10-0
      kube_tag: v1.37.2
- job:
    name: magnum-cluster-api-hydrophone-v1.37.2-calico
    parent: magnum-cluster-api-hydrophone-v1.37.2
    vars:
      network_driver: calico
- job:
    name: magnum-cluster-api-hydrophone-v1.37.2-cilium
    parent: magnum-cluster-api-hydrophone-v1.37.2
    vars:
      network_driver: cilium
- job:
    name: magnum-cluster-api-hydrophone-kubelet-serving-cert-verification
    parent: magnum-cluster-api-hydrophone-v1.37.2-calico
    vars:
      kubelet_serving_cert_verification: true
      hydrophone_focus:
        - Kubectl logs logs should be able to retrieve and filter logs
        - Pods should support remote command execution over websockets
        - Pods should support retrieving logs from the container over websockets
        - Kubectl Port forwarding With a server listening on localhost should support forwarding over websockets
