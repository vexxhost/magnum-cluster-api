[tox]
minversion = 4.22
envlist = py3

[testenv]
# Build the wheel from the source tree so repeated builds reuse Cargo's
# target/ cache instead of compiling the Rust extension from scratch.
package = wheel
dependency_groups = dev

[testenv:{unit,py3,py38,py39,py310}]
commands =
  pytest magnum_cluster_api/tests/unit/

[testenv:functional]
passenv =
  KUBECONFIG
commands =
  stestr --test-path=./magnum_cluster_api/tests/functional run {posargs}
  stestr slowest
